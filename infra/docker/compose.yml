# Локальное окружение Lumeva.
#
# Запуск из папки infra/docker:
#   docker compose --profile core up -d                   # Postgres, Kafka, Schema Registry, Kafka UI, Valkey, Keycloak
#   docker compose --profile core --profile cdc up -d     # + Debezium Connect
#   docker compose --profile core --profile data up -d    # + MongoDB
#
# Переменные берутся из .env рядом с этим файлом (шаблон — .env.example).

name: lumeva

services:

  # ---------- core ----------

  postgres:
    image: postgres:17-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # пароли пользователей сервисов — читает init-скрипт
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    # logical — для CDC через Debezium
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    profiles: ["core"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнеров (kafka:29092), EXTERNAL — для сервисов, запущенных из IDE (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # один брокер — фактор репликации служебных топиков 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создаём явно (из кода или скриптом), а не случайной опечаткой в имени
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    profiles: ["core"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      # по умолчанию новая версия схемы должна читать данные старой (ADR-005)
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    ports:
      - "8085:8081"   # 8081 на хосте занят profile-service

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    profiles: ["core"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: lumeva-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
    ports:
      - "8090:8080"

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["core"]
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    profiles: ["core"]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # подставляются в realm-файл при импорте
      LUMEVA_BFF_CLIENT_SECRET: ${LUMEVA_BFF_CLIENT_SECRET}
      PROFILE_SERVICE_CLIENT_SECRET: ${PROFILE_SERVICE_CLIENT_SECRET}
      LUMEVA_TEST_USER_PASSWORD: ${LUMEVA_TEST_USER_PASSWORD}
    ports:
      - "8180:8080"   # 8080 на хосте — для Gateway
    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import:ro
      # - ../keycloak/providers:/opt/keycloak/providers:ro   # event-listener SPI (ADR-008), включим позже
      # - ../keycloak/themes:/opt/keycloak/themes:ro         # русские темы входа, позже

  # ---------- cdc ----------

  debezium:
    image: quay.io/debezium/connect:3.0.0.Final
    profiles: ["cdc"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: lumeva-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Пароль подставляется из окружения при запуске коннектора и не хранится
      # открытым текстом в топике _connect_configs
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
    ports:
      - "8083:8083"

  # ---------- data ----------

  mongodb:
    image: mongo:8.0
    profiles: ["data"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_PROFILE_PASSWORD: ${MONGO_PROFILE_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  kafka_data:
  valkey_data:
  mongo_data:
