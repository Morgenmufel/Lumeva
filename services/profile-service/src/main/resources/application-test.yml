spring:
  liquibase:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/dummy-certs

lumeva:
  kafka:
    # mock:// — Registry в памяти из библиотеки Confluent, внешний сервис не нужен
    schema-registry-url: mock://profile-service-test
    auto-register-schemas: true
