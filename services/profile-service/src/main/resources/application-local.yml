server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/lumeva_profile
    username: profile
    password: ${PROFILE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${VALKEY_PASSWORD}

  mongodb:
    uri: mongodb://profile:${MONGO_PROFILE_PASSWORD}@localhost:27017/lumeva_profile_read?authSource=lumeva_profile_read

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          # ключи JWKS Spring находит сам по адресу issuer; iss в токене обязан совпасть
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lumeva}

lumeva:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    auto-register-schemas: true

logging:
  level:
    root: INFO
    lumeva.profileservice: DEBUG
    org.springframework.security: INFO
