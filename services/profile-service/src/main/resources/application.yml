lumeva:
  api:
    prefix: "/api/v1"
  cache:
    profile-prefix: "profile:public:"
  outbox:
    # строки outbox нужны только для отладки, доставку делает Debezium по WAL (ADR-006)
    retention: P7D
    # раз в сутки ночью, в UTC
    cleanup-cron: "0 30 3 * * *"
  kafka:
    topics:
      # все события профиля в одном топике, ключ — userId (порядок внутри профиля, ADR-006)
      profile-events: "lumeva.profile.events"
      # DLT своя у каждой consumer group: при переигрывании сообщение вернётся только тому, кто на нём упал
      profile-events-projection-dlt: "lumeva.profile.events.profile-read-projection.DLT"
    projection:
      group-id: "profile-read-projection"
    schema-registry-url: ${SCHEMA_REGISTRY_URL}
    # в prod схемы регистрирует CI до деплоя, сервис только читает их id (Р5)
    auto-register-schemas: false

spring:
  application:
    name: profile-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    default-property-inclusion: non_null

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    consumer:
      # новая consumer group читает топик с начала и строит read-модель с нуля
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Avro разбираем сами в listener: так в DLT уходят исходные байты, а не пересериализованный объект
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      # продюсер нужен только для DLT: отправляет байты исходного сообщения как есть
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  mongodb:
    representation:
      uuid: standard

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
